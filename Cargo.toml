[package]
name = "brute"
version = "0.1.8"
edition = "2024"
description = "A Rust-based multi-protocol credential testing and login verification CLI for authorized security assessments."
license = "BSD-3-Clause"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
futures = "0.3"
mysql = { version = "26.0", default-features = false, features = [
    "minimal",
    "rustls-tls",
] }
# Vendored OpenSSL so rdp-rs/native-tls does not require system libssl at runtime
# (static single-file builds). IronRDP cannot resolve with smb2 (aes-gcm pin conflict).
openssl = { version = "0.10", features = ["vendored"] }
redis = { version = "0.32", default-features = false, features = [
    "tokio-comp",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
] }
oracle-rs = { git = "https://github.com/cyhfvg/oracle-rs" }
rdp-rs = "0.1"
russh = { version = "0.60", default-features = false, features = [
    "ring",
    "flate2",
    "rsa",
] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smb2 = "0.13"
suppaftp = { version = "8.0", default-features = false, features = [
    "tokio-rustls-ring",
] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
# Forked winrm-rs: sealed NTLM, real PSRP, pypsrp-aligned SessionId (perf).
# No Cargo [patch]; no in-tree brute-winrm / brute-psrp path crates.
winrm-rs = { git = "https://github.com/cyhfvg/winrm-rs" }
des = "0.8"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "cli"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
