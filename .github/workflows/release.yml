name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BINARY_NAME: brute

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native Linux static build (musl toolchain on Ubuntu).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive_ext: tar.gz
            asset_suffix: ""
            packages: musl-tools
          # Native Windows build (MSVC host/toolchain on windows-latest).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            asset_suffix: .exe
            packages: ""
          # Native Intel macOS build (no Apple cross-compile).
          - target: x86_64-apple-darwin
            os: macos-13
            archive_ext: tar.gz
            asset_suffix: ""
            packages: ""
          # Native Apple Silicon macOS build.
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
            asset_suffix: ""
            packages: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux' && matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          ASSET_BASENAME="${BINARY_NAME}-${TAG_NAME}-${TARGET}"
          mkdir -p dist
          cp "target/${TARGET}/release/${BINARY_NAME}${ASSET_SUFFIX}" "dist/${BINARY_NAME}${ASSET_SUFFIX}"
          cp README.md LICENSE dist/

          if [ "${ARCHIVE_EXT}" = "tar.gz" ]; then
            tar -C dist -czf "${ASSET_BASENAME}.tar.gz" \
              "${BINARY_NAME}${ASSET_SUFFIX}" README.md LICENSE
          elif command -v zip >/dev/null 2>&1; then
            (
              cd dist
              zip -9 "../${ASSET_BASENAME}.zip" \
                "${BINARY_NAME}${ASSET_SUFFIX}" README.md LICENSE
            )
          else
            # windows-latest may not ship zip(1); bsdtar can emit .zip via -a.
            tar -C dist -a -cf "${ASSET_BASENAME}.zip" \
              "${BINARY_NAME}${ASSET_SUFFIX}" README.md LICENSE
          fi

          ls -la "${ASSET_BASENAME}.${ARCHIVE_EXT}"

      - name: Upload packaged asset
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog from commits
        uses: orhun/git-cliff-action@v4
        with:
          args: --current --strip header
        env:
          OUTPUT: generated-changelog.md
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render release notes
        run: |
          if [ ! -s generated-changelog.md ]; then
            echo "_No conventional commits found for this release._" > generated-changelog.md
          fi

          perl -0pe '
            BEGIN {
              local $/;
              open my $fh, "<", "generated-changelog.md" or die $!;
              our $changelog = <$fh>;
            }
            s/\{\{ version \}\}/$ENV{GITHUB_REF_NAME}/g;
            our $changelog;
            s/\{\{ changelog \}\}/$changelog/ge;
          ' .github/RELEASE_TEMPLATE.md > release-notes.md

      - name: Download packaged assets
        uses: actions/download-artifact@v6
        with:
          path: release-assets

      - name: Generate SHA256SUMS manifest
        run: |
          find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            sort -z |
            while IFS= read -r -d '' asset; do
              checksum="$(sha256sum "${asset}" | awk '{print $1}')"
              printf '%s  %s\n' "${checksum}" "$(basename "${asset}")"
            done > release-assets/SHA256SUMS.txt

          test -s release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            release-assets/SHA256SUMS.txt
