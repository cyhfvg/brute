services:
  etcd-open:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd-open
    restart: "no"
    command:
      - etcd
      - --name=open
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=open=http://127.0.0.1:2380
    ports:
      - "2379:2379"

  etcd-auth:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd-auth
    restart: "no"
    command:
      - etcd
      - --name=auth
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --initial-cluster=auth=http://127.0.0.1:2380
    ports:
      - "2381:2379"
