services:
  spark:
    image: apache/spark:3.5.1
    container_name: spark-brute-lab
    restart: "no"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      ["org.apache.spark.deploy.master.Master", "--host", "0.0.0.0"]

  proxy:
    image: nginx:1.27-alpine
    container_name: spark-proxy-brute-lab
    restart: "no"
    depends_on:
      - spark
    ports:
      - "4040:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./htpasswd:/etc/nginx/htpasswd:ro
