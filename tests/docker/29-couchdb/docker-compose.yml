services:
  couchdb:
    image: couchdb:3.3.3
    container_name: couchdb-brute-lab
    restart: "no"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: couch_pass
    ports:
      - "5984:5984"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://admin:couch_pass@127.0.0.1:5984/_up >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
