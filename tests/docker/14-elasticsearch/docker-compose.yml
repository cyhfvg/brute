services:
  elasticsearch-open:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: elasticsearch-open
    restart: "no"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  elasticsearch-auth:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.28
    container_name: elasticsearch-auth
    restart: "no"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: elastic_pass
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "9201:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -u elastic:elastic_pass http://127.0.0.1:9200 >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
