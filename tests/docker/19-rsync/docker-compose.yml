services:
  rsync:
    image: alpine:3.20
    container_name: rsync-brute-lab
    restart: "no"
    ports:
      - "873:873"
    volumes:
      - ./rsyncd.conf:/etc/rsyncd.conf:ro
      - ./rsyncd.secrets:/opt/rsyncd.secrets:ro
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache rsync >/dev/null
        cp /opt/rsyncd.secrets /etc/rsyncd.secrets
        chmod 600 /etc/rsyncd.secrets
        mkdir -p /data
        echo hello > /data/readme.txt
        exec rsync --daemon --no-detach --config=/etc/rsyncd.conf
