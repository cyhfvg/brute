services:
  memcached-open:
    image: memcached:1.6-alpine
    container_name: memcached-open
    restart: "no"
    ports:
      - "11211:11211"
    command: ["memcached", "-m", "64", "-p", "11211"]
    healthcheck:
      test: ["CMD-SHELL", "echo version | nc 127.0.0.1 11211 | grep -q VERSION"]
      interval: 5s
      timeout: 3s
      retries: 10

  memcached-sasl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: memcached-sasl
    restart: "no"
    ports:
      - "11212:11211"
    environment:
      MEMCACHED_USER: admin
      MEMCACHED_PASS: memcached_pass
    healthcheck:
      test: ["CMD-SHELL", "pgrep memcached >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
