services:
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos-brute-lab
    restart: "no"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: secret
    ports:
      - "8848:8848"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8848/nacos/v1/console/health/readiness >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 45s
