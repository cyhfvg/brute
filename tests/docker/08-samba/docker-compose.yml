name: samba

services:
  samba:
    image: "${SMB_IMAGE:-ghcr.io/servercontainers/samba:smbd-only-latest}"
    container_name: "${SMB_CONTAINER_NAME:-samba}"
    hostname: "${SMB_HOSTNAME:-samba}"

    restart: unless-stopped

    ports:
      # 默认只允许宿主机本地访问。
      #
      # 局域网访问时，在 .env 中将 SMB_BIND_HOST 修改为
      # 宿主机的实际局域网 IP。
      - "${SMB_BIND_HOST:-127.0.0.1}:${SMB_PORT:-445}:445/tcp"

    environment:
      TZ: "${TZ:-Asia/Shanghai}"

      # 用户或组创建失败时直接终止启动
      FAIL_FAST: "1"

      # 关闭 NetBIOS，仅使用 TCP 445
      NETBIOS_DISABLE: "1"

      # Samba 基础配置
      SAMBA_CONF_WORKGROUP: "${SMB_WORKGROUP:-WORKGROUP}"
      SAMBA_CONF_SERVER_STRING: "${SMB_SERVER_STRING:-Docker Samba Server}"
      SAMBA_CONF_LOG_LEVEL: "${SMB_LOG_LEVEL:-1}"

      # 禁止未知用户映射为 guest
      SAMBA_CONF_MAP_TO_GUEST: "Never"

      # 禁止 SMBv1，允许 SMB 2.1～SMB 3.1.1
      SAMBA_GLOBAL_CONFIG_min_protocol: "server min protocol = SMB2_10"
      SAMBA_GLOBAL_CONFIG_max_protocol: "server max protocol = SMB3_11"

      # ============================================================
      # 公共 Samba 用户组
      # ============================================================

      GROUP_smbusers: "${SMB_USERS_GID:-1500}"

      # ============================================================
      # 用户 1：alice
      # ============================================================

      ACCOUNT_alice: "${SMB_ALICE_PASSWORD:?SMB_ALICE_PASSWORD must be set}"
      UID_alice: "${SMB_ALICE_UID:-1001}"
      GROUPS_alice: "smbusers"

      # ============================================================
      # 用户 2：bob
      # ============================================================

      ACCOUNT_bob: "${SMB_BOB_PASSWORD:?SMB_BOB_PASSWORD must be set}"
      UID_bob: "${SMB_BOB_UID:-1002}"
      GROUPS_bob: "smbusers"

      # ============================================================
      # 用户 3：charlie
      # ============================================================

      ACCOUNT_charlie: "${SMB_CHARLIE_PASSWORD:?SMB_CHARLIE_PASSWORD must be set}"
      UID_charlie: "${SMB_CHARLIE_UID:-1003}"
      GROUPS_charlie: "smbusers"

      # ============================================================
      # 共享目录
      # ============================================================

      SAMBA_VOLUME_CONFIG_data: |
        [${SMB_SHARE_NAME:-data}]
         path = /shares/data
         valid users = +smbusers
         guest ok = no
         browseable = yes
         read only = no
         force group = +smbusers
         create mask = 0660
         force create mode = 0660
         directory mask = 2770
         force directory mode = 2770

    volumes:
      # 宿主机共享目录
      - "${SMB_DATA_PATH:-./data}:/shares/data"

    healthcheck:
      test: ["CMD", "/container/scripts/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    networks:
      - samba_network

networks:
  samba_network:
    name: "${SMB_NETWORK_NAME:-samba_network}"
    driver: bridge
