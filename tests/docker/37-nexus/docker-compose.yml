services:
  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: nexus-brute-lab
    restart: "no"
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:8081/service/rest/v1/status >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 90s
