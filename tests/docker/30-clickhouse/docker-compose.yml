services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-brute-lab
    restart: "no"
    environment:
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: click_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "admin",
          "--password",
          "click_pass",
          "--query",
          "SELECT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
